# Pages CMS configuration — https://pagescms.org
#
# - Projects are a collection under content/*.md; a GitHub Action recompiles
#   them into data/projects.json (.github/workflows/build-content.yml).
# - Single-instance sections (competences, parcours, ...) are edited directly
#   as the data/*.json files the site fetches — no build step.

media:
  input: data/media
  output: /data/media
  extensions: [png, jpg, jpeg, webp, gif, svg]

content:
  - name: projects
    label: Projets
    type: collection
    path: content/projects
    filename: "{fields.title | slugify}.md"
    view:
      fields: [title, tags, order, featured]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: wordmark
        label: Nom affiché sur la carte
        type: string
        description: "Grand texte de l'en-tête de carte. Vide = reprend le titre."
      - name: icon
        label: Icône (Phosphor)
        type: string
        description: "Nom de l'icône sans le préfixe ph- (ex. camera, crown). Voir phosphoricons.com."
        default: cube
      - name: image
        label: Image de couverture
        type: image
        description: "Optionnelle. Si présente, remplace l'icône et le nom sur l'en-tête."
      - name: tags
        label: Technologies
        type: string
        list: true
      - name: repo
        label: Lien du dépôt
        type: string
        pattern:
          regex: "^https?://.+"
          message: "Doit être une URL (http/https)."
      - name: demo
        label: Lien de la démo
        type: string
        pattern:
          regex: "^https?://.+"
          message: "Doit être une URL (http/https)."
      - name: order
        label: Ordre d'affichage
        type: number
        default: 99
      - name: featured
        label: Mis en avant
        type: boolean
        default: false
      - name: body
        label: Description
        type: rich-text

  - name: competences
    label: Compétences
    type: file
    path: data/competences.json
    fields:
      - name: groups
        label: Groupes de compétences
        type: object
        list: true
        fields:
          - name: title
            label: Titre du groupe
            type: string
            required: true
          - name: tags
            label: Compétences / technologies
            type: string
            list: true
          - name: note
            label: Précision (optionnelle)
            type: text
      - name: languages
        label: Langues
        type: object
        list: true
        fields:
          - name: name
            label: Langue
            type: string
            required: true
          - name: level
            label: Niveau (CECR)
            type: string
          - name: pct
            label: Progression (0-100)
            type: number

  - name: parcours
    label: Parcours
    type: file
    path: data/parcours.json
    fields:
      - name: experiences
        label: Expériences professionnelles
        type: object
        list: true
        fields:
          - name: period
            label: Période
            type: string
            required: true
          - name: title
            label: Poste
            type: string
            required: true
          - name: org
            label: Organisation
            type: string
      - name: academic
        label: Parcours académique
        type: object
        list: true
        fields:
          - name: period
            label: Période
            type: string
            required: true
          - name: title
            label: Diplôme / formation
            type: string
            required: true
          - name: org
            label: Établissement
            type: string
