<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mistral Théo</title>
<meta name="description" content="Portfolio de Théo Mistral (mistheo).">

<!-- FONTS: Google Fonts preconnect + stylesheet (display + body typefaces) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<!-- ICONS: Phosphor icon font, used via <i class="ph-light ph-*"> -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css">

<script src="https://cdn.tailwindcss.com"></script>
<script src="scripts/tailwind-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script type="module" src="scripts/main.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- LOCAL STYLES: custom CSS on top of Tailwind utilities -->
<link rel="stylesheet" href="styles/main.css">
</head>
<!-- APP ROOT: Alpine component instance (see scripts/portfolio.js), initialized on load -->
<body x-data="portfolio()" x-init="init()" class="min-h-screen font-body antialiased">

<!-- BACKGROUND: purely decorative ambient layer (breathing glow, grain, vignette), hidden from a11y tree -->
<div class="amb" aria-hidden="true">
  <div class="amb__breath"></div>
  <div class="amb__grain"></div>
  <div class="amb__vignette"></div>
</div>

<!-- TRANSITION OVERLAY: full-screen "veil" driven by waveClass (rising/falling)
     to mask the swap between index and section views (see scripts/transition.js) -->
<div class="veil" :class="waveClass" aria-hidden="true">
  <div class="veil__mass"></div>
  <div class="veil__grain"></div>
</div>

<!-- MAIN: centered content column, hidden via x-cloak until Alpine has parsed x-data -->
<main x-cloak class="relative z-10 mx-auto w-full max-w-[1180px] px-6 sm:px-10 lg:px-16">

  <!-- INDEX VIEW: landing screen, shown when view === 'index' -->
  <div x-show="view === 'index'" class="min-h-screen flex flex-col justify-start py-10 sm:py-20">

    <!-- HEADER: identity block, name + role bound to meta.* from the loaded manifest -->
    <header class="fade-in flex flex-col gap-6 sm:flex-row sm:items-end sm:justify-between sm:gap-10">
      <div>
        <h1 class="font-display uppercase leading-none text-[clamp(2rem,4.5vw,3.25rem)] font-medium tracking-[.02em]"
            x-text="meta.name || 'Portfolio'"></h1>
        <p class="mt-2 text-[13px] uppercase tracking-[.34em] text-ash" x-text="meta.role"></p>
      </div>

      <!-- CONTACT LIST: looped from meta.contacts, each entry is an external link with an icon -->
      <div class="flex w-full flex-col gap-1 sm:w-auto sm:flex-row sm:flex-wrap sm:items-center sm:gap-x-8 sm:gap-y-3 sm:justify-end">
        <template x-for="c in meta.contacts" :key="c.label">
          <a :href="c.href" class="contact group inline-flex items-center gap-3" target="_blank" rel="noopener">
            <i class="contact__icon ph-light" :class="'ph-' + (c.icon || 'link-simple')" aria-hidden="true"></i>
            <span class="hidden lg:inline text-[10px] uppercase tracking-[.24em] text-ash" x-text="c.label"></span>
            <span class="border-b border-[#333] pb-[2px] text-[13px] transition-colors group-hover:border-bone" x-text="c.value"></span>
          </a>
        </template>
      </div>
    </header>

    <!-- ERROR BANNER: surfaces fetch failures from data.js (manifest or section not found) -->
    <div x-show="error" x-cloak class="mt-6 border border-[#2a2a2a] bg-[#111] px-4 py-3 text-[13px] text-ash">
      <span class="text-bone">Erreur de chargement <br> </span><span x-text="error"></span>
    </div>

    <!-- SECTION NAV: looped from sections[], click triggers go(s) into navigation.js goToSection -->
    <nav class="my-auto py-10 sm:py-20 stagger" aria-label="Sections">
      <template x-for="(s, i) in sections" :key="s.id">
        <div class="border-t border-[#191919] last:border-b" :style="`animation-delay:${140 + i * 90}ms`">
          <a class="track group flex items-baseline gap-3 sm:gap-8 py-3 sm:py-5"
             :href="'#' + s.id"
             @click.prevent="go(s)">
            <!-- index number, 1-based and zero-padded -->
            <span class="font-body text-[10px] sm:text-xs tracking-[.24em] text-ash pt-1 sm:pt-4 shrink-0"
                  x-text="String(i + 1).padStart(2, '0')"></span>
            <!-- title, duplicated (out/fill) for the hover fill animation -->
            <span class="track__line relative flex-1">
              <span class="track__out block" x-text="s.title"></span>
              <span class="track__fill block" aria-hidden="true" x-text="s.title"></span>
            </span>
          </a>
        </div>
      </template>
    </nav>
  </div>

  <!-- SECTION VIEW: detail screen, shown when view === 'section' -->
  <div x-show="view === 'section'" class="min-h-screen py-10 sm:py-20">

    <!-- BACK BUTTON: triggers back() into navigation.js goBack, replays the transition in reverse -->
    <button @click="back()"
            class="group inline-flex min-h-[44px] items-center gap-3 text-[22px] uppercase tracking-[.24em] text-ash transition-colors hover:text-bone">
      <i class="ph-light ph-arrow-left text-[27px] leading-none transition-transform duration-300 group-hover:-translate-x-1" aria-hidden="true"></i>
      Retour
    </button>

    <!-- SECTION HEADER: current section's index (getter) and title -->
    <header class="mt-6 sm:mt-10 border-b border-[#191919] pb-5 sm:pb-6">
      <!-- <p class="text-[11px] tracking-[.24em] text-ash" x-text="currentIndex"></p> -->
      <h2 class="track__line mt-2" x-text="current ? current.title : ''"></h2>
    </header>

    <!-- SECTION CONTENT: either a data-backed layout (Alpine template) or
         markdown converted to HTML by marked.js and injected via x-html -->

    <!-- PROJECTS LAYOUT: grid looped from currentData (data/projects.json) -->
    <template x-if="current && current.layout === 'projects'">
      <div class="not-prose mt-8 sm:mt-10 grid gap-6 sm:grid-cols-2">
        <template x-for="p in currentData" :key="p.slug">
          <div class="group flex flex-col overflow-hidden rounded-2xl border border-[#242424] bg-[#111] shadow-[0_1px_0_#1e1e1e,0_20px_40px_-30px_rgba(0,0,0,.9)] transition-all hover:border-[#3a3a3a] hover:bg-[#141414]">
            <!-- CARD HEADER: cover image if set, otherwise ghost icon + wordmark -->
            <div class="relative flex h-40 items-center justify-center overflow-hidden bg-gradient-to-br from-[#1c1c1c] via-[#141414] to-[#0d0d0d]">
              <template x-if="p.image">
                <img :src="p.image" :alt="p.title" loading="lazy" class="absolute inset-0 h-full w-full object-cover">
              </template>
              <template x-if="!p.image">
                <i class="ph-light absolute text-[110px] text-[#ffffff08]" :class="'ph-' + (p.icon || 'cube')" aria-hidden="true"></i>
              </template>
              <span x-show="!p.image"
                    class="font-display font-semibold uppercase tracking-[.08em] text-bone text-[clamp(1.7rem,6vw,2.6rem)] px-4 text-center leading-none"
                    x-text="p.wordmark || p.title"></span>
            </div>
            <div class="flex flex-1 flex-col p-6">
              <h3 class="font-display uppercase tracking-[.14em] text-[18px] font-semibold text-bone" x-text="p.title"></h3>
              <div class="mt-3 flex-1 text-[13px] leading-relaxed text-ash [&_p]:m-0 [&_p+p]:mt-2 [&_a]:border-b [&_a]:border-[#3a3a3a]"
                   x-html="p.descriptionHtml"></div>
              <div class="mt-4 flex flex-wrap gap-2" x-show="p.tags && p.tags.length">
                <template x-for="t in p.tags" :key="t">
                  <span class="rounded-md border border-[#2c2c2c] bg-[#161616] px-2.5 py-1 text-[11px] text-ash" x-text="t"></span>
                </template>
              </div>
              <div class="mt-5 flex gap-3" x-show="p.demo || p.repo">
                <template x-if="p.demo">
                  <a :href="p.demo" target="_blank" rel="noopener"
                     class="inline-flex items-center gap-2 rounded-lg border border-[#2c2c2c] bg-bone px-3.5 py-2 text-[12px] uppercase tracking-[.14em] text-[#111] transition-opacity hover:opacity-90">
                    <i class="ph-light ph-play text-[16px]" aria-hidden="true"></i>Démo</a>
                </template>
                <template x-if="p.repo">
                  <a :href="p.repo" target="_blank" rel="noopener"
                     class="inline-flex items-center gap-2 rounded-lg border border-[#2c2c2c] bg-[#161616] px-3.5 py-2 text-[12px] uppercase tracking-[.14em] text-bone transition-colors hover:border-bone">
                    <i class="ph-light ph-github-logo text-[16px]" aria-hidden="true"></i>Repo</a>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- COMPETENCES LAYOUT: card grid (groups) + a languages card, from data/competences.json -->
    <template x-if="current && current.layout === 'competences'">
      <div class="not-prose mt-8 sm:mt-10 grid gap-5 sm:grid-cols-2">
        <template x-for="g in (currentData ? currentData.groups : [])" :key="g.title">
          <div class="group rounded-2xl border border-[#242424] bg-[#111] p-7 shadow-[0_1px_0_#1e1e1e,0_20px_40px_-30px_rgba(0,0,0,.9)] transition-all hover:border-[#3a3a3a] hover:bg-[#141414]">
            <h3 class="font-display uppercase tracking-[.16em] text-[19px] font-semibold text-bone" x-text="g.title"></h3>
            <div class="mt-2 h-px w-10 bg-[#3a3a3a] transition-all group-hover:w-16 group-hover:bg-bone"></div>
            <div class="mt-5 flex flex-wrap gap-2" x-show="g.tags && g.tags.length">
              <template x-for="t in g.tags" :key="t">
                <span class="rounded-md border border-[#2c2c2c] bg-[#161616] px-2.5 py-1 text-[12px] text-bone" x-text="t"></span>
              </template>
            </div>
            <p class="mt-5 text-[13px] leading-relaxed text-ash" x-show="g.note" x-text="g.note"></p>
          </div>
        </template>

        <div class="group rounded-2xl border border-[#242424] bg-[#111] p-7 shadow-[0_1px_0_#1e1e1e,0_20px_40px_-30px_rgba(0,0,0,.9)] transition-all hover:border-[#3a3a3a] hover:bg-[#141414]"
             x-show="currentData && currentData.languages && currentData.languages.length">
          <h3 class="font-display uppercase tracking-[.16em] text-[19px] font-semibold text-bone">Langues</h3>
          <div class="mt-2 h-px w-10 bg-[#3a3a3a] transition-all group-hover:w-16 group-hover:bg-bone"></div>
          <div class="mt-5 space-y-4">
            <template x-for="l in (currentData ? currentData.languages : [])" :key="l.name">
              <div>
                <div class="flex items-center justify-between">
                  <span class="text-[14px] text-bone" x-text="l.name"></span>
                  <span class="text-[11px] uppercase tracking-[.24em] text-ash" x-text="l.level"></span>
                </div>
                <div class="mt-2 h-[4px] w-full rounded-full bg-[#1c1c1c]">
                  <div class="h-full rounded-full bg-bone" :style="`width:${l.pct}%`"></div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>

    <!-- PARCOURS LAYOUT: two timelines (experiences, academic), from data/parcours.json -->
    <template x-if="current && current.layout === 'parcours'">
      <div class="not-prose mt-8 sm:mt-10">
        <template x-for="block in [
          { key: 'experiences', label: 'Expériences professionnelles' },
          { key: 'academic', label: 'Parcours académique' }
        ]" :key="block.key">
          <div class="mt-14 first:mt-0" x-show="currentData && currentData[block.key] && currentData[block.key].length">
            <h3 class="font-display uppercase tracking-[.16em] text-[22px] font-semibold text-bone" x-text="block.label"></h3>
            <div class="mt-2 h-px w-14 bg-bone"></div>
            <div class="mt-8 space-y-8 border-l border-[#ddd] pl-7">
              <template x-for="(item, i) in (currentData ? currentData[block.key] : [])" :key="block.key + i">
                <div class="relative">
                  <span class="absolute -left-[33px] top-1.5 h-2.5 w-2.5 rounded-full border border-[#fff] bg-[#111]"></span>
                  <p class="text-[10px] uppercase tracking-[.28em] text-ash" x-text="item.period"></p>
                  <p class="mt-1 text-[17px] font-medium text-bone" x-text="item.title"></p>
                  <p class="text-[13px] text-ash" x-text="item.org"></p>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- CONTACT LAYOUT: identity + hobbies + contact details, from data/contact.json -->
    <template x-if="current && current.layout === 'contact'">
      <div class="not-prose mt-8 sm:mt-10">
        <p class="text-[25px] leading-relaxed text-bone" x-text="currentData ? currentData.intro : ''"></p>
        <p class="mt-4 text-[14px] leading-relaxed text-ash" x-text="currentData ? currentData.bio : ''"></p>

        <template x-if="currentData && currentData.hobbies && currentData.hobbies.length">
          <div>
            <h3 class="mt-12 font-display uppercase tracking-[.16em] text-[22px] font-semibold text-bone">Mes loisirs</h3>
            <div class="mt-2 h-px w-14 bg-bone"></div>
            <div class="mt-6 flex flex-wrap gap-3">
              <template x-for="h in currentData.hobbies" :key="h.label">
                <span class="inline-flex items-center gap-2 rounded-lg border border-[#2c2c2c] bg-[#141414] px-3.5 py-2 text-[13px] text-bone">
                  <i class="ph-light text-[18px] text-ash" :class="'ph-' + (h.icon || 'circle')" aria-hidden="true"></i><span x-text="h.label"></span>
                </span>
              </template>
            </div>
          </div>
        </template>

        <h3 class="mt-12 font-display uppercase tracking-[.16em] text-[22px] font-semibold text-bone">Contact</h3>
        <div class="mt-2 h-px w-14 bg-bone"></div>
        <div class="mt-6 space-y-3">
          <a x-show="currentData && currentData.email" :href="`mailto:${currentData ? currentData.email : ''}`"
             class="group inline-flex items-center gap-3 rounded-lg border border-[#2c2c2c] bg-[#141414] px-4 py-3 text-[14px] text-bone transition-colors hover:border-[#3a3a3a]">
            <i class="ph-light ph-envelope-simple text-[20px] text-ash transition-colors group-hover:text-bone" aria-hidden="true"></i><span x-text="currentData ? currentData.email : ''"></span>
          </a>
          <template x-for="d in (currentData ? currentData.details : [])" :key="d.label">
            <div class="inline-flex items-center gap-3 rounded-lg border border-[#2c2c2c] bg-[#141414] px-4 py-3 text-[14px] text-bone">
              <i class="ph-light text-[20px] text-ash" :class="'ph-' + (d.icon || 'info')" aria-hidden="true"></i>
              <span><span x-text="d.label"></span><span class="text-ash" x-show="d.note" x-text="` (${d.note})`"></span></span>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- MARKDOWN LAYOUT: default when a section has no dedicated layout -->
    <template x-if="!current || !current.layout">
      <article class="prose mt-8 sm:mt-10 max-w-[68ch]" x-html="currentHtml"></article>
    </template>
  </div>

</main>

</body>
</html>
