name: Build content

# Recompiles content/*.md -> data/*.json whenever the editable sources change
# (including commits made by Pages CMS), then commits the regenerated JSON back.
# The data/ path is intentionally NOT a trigger, so the bot commit does not loop.

on:
  push:
    branches: [master]
    paths:
      - "content/**"
      - "scripts/build-content.mjs"
      - "package.json"
      - ".github/workflows/build-content.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --no-audit --no-fund

      - run: npm run build:content

      - name: Commit regenerated data
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "content: rebuild data from content sources"
            git push
          else
            echo "No data changes to commit."
          fi
